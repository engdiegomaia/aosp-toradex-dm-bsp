 *
 * Dual-bootloader SPL container for Apalis iMX8QM Android build.
 * Loaded by SPL (which itself was loaded from imx-boot AHAB container).
 * Identical shape to board/freescale/imx8qm_mek/uboot-container.cfg —
 * same SoC, same ATF entry, same u-boot text base.
 */

BOOT_FROM SD 0x400
SOC_TYPE IMX8QM
CONTAINER
IMAGE A35 bl31.bin	0x80000000
IMAGE A35 u-boot.bin	CONFIG_TEXT_BASE
